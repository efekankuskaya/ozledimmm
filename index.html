<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Çok Seviyorum</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fdf0f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Başlangıçtaki Tıklanabilir Zarf/Buton */
        #trigger-btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 10;
        }

        #trigger-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 77, 109, 0.4);
        }

        /* Açılan İçerik Kartı */
        #content-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            position: absolute;
        }

        #content-card.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* Polaroid Fotoğraf Alanı */
        .polaroid {
            background: white;
            padding: 10px 10px 20px 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transform: rotate(-3deg);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .polaroid img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
        }

        .polaroid p {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: #333;
            margin-top: 10px;
        }

        /* Mesaj Metni */
        .message-title {
            color: #ff4d6d;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .message-text {
            color: #555;
            line-height: 1.6;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* Uçuşan Kalpler Animasyonu */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: float 4s linear infinite;
            opacity: 0;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- İlk Ekran: Buton -->
    <button id="trigger-btn">Beni Çok Özlediğinde Tıkla 💌</button>

    <!-- İkinci Ekran: Açılan Kart -->
    <div id="content-card">
        <div class="polaroid">
            <!-- FOTOĞRAF AYNI DİZİNDEN ÇEKİLİYOR -->
            <img src="fotograf.jpg" alt="Biz">
            <p>En güzel anımız...</p>
        </div>
        
        <h2 class="message-title">Ben de seni çok özledim!</h2>
        <p class="message-text">
            Şu an yanında olamasam da, kalbim her saniye seninle atıyor. 
            Aramızdaki kilometreler sadece haritadaki çizgilerden ibaret. 
            Gözlerini kapat ve sana sımsıkı sarıldığımı hisset. 
            Çok yakında bu fotoğraf karesindeki gibi yine yan yana olacağız.
        </p>
    </div>

    <script>
        const triggerBtn = document.getElementById('trigger-btn');
        const contentCard = document.getElementById('content-card');
        let heartsInterval;

        triggerBtn.addEventListener('click', () => {
            triggerBtn.style.display = 'none';
            contentCard.classList.add('show');
            startHearts();
        });

        function startHearts() {
            heartsInterval = setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤';
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.fontSize = Math.random() * 15 + 10 + 'px';
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>
</body>
</html>
